apiVersion: '2021-09-01'
location: eastus
name: yath-services
properties:
  containers:
  # RabbitMQ - Message Bus
  - name: rabbitmq
    properties:
      image: yathregistry.azurecr.io/rabbitmq:latest
      resources:
        requests:
          cpu: 0.3
          memoryInGb: 0.5
      ports:
      - protocol: tcp
        port: 5672
      - protocol: tcp
        port: 15672
      environmentVariables:
      - name: RABBITMQ_DEFAULT_USER
        value: guest
      - name: RABBITMQ_DEFAULT_PASS
        value: guest
  
  # Seq - Logging
  - name: seq
    properties:
      image: yathregistry.azurecr.io/seq:latest
      resources:
        requests:
          cpu: 0.2
          memoryInGb: 0.5
      ports:
      - protocol: tcp
        port: 5341
      - protocol: tcp
        port: 80
      environmentVariables:
      - name: ACCEPT_EULA
        value: Y
  
  # User Service
  - name: user-service
    properties:
      image: yathregistry.azurecr.io/yath-user-service:latest
      resources:
        requests:
          cpu: 0.5
          memoryInGb: 0.8
      ports:
      - protocol: tcp
        port: 5000
      environmentVariables:
      - name: ASPNETCORE_ENVIRONMENT
        value: Production
      - name: ASPNETCORE_URLS
        value: http://+:5000
  
  # Trip Service
  - name: trip-service
    properties:
      image: yathregistry.azurecr.io/yath-trip-service:latest
      resources:
        requests:
          cpu: 0.4
          memoryInGb: 0.8
      ports:
      - protocol: tcp
        port: 5001
      environmentVariables:
      - name: ASPNETCORE_ENVIRONMENT
        value: Production
      - name: ASPNETCORE_URLS
        value: http://+:5001
  
  # Activity Service
  - name: activity-service
    properties:
      image: yathregistry.azurecr.io/yath-activity-service:latest
      resources:
        requests:
          cpu: 0.4
          memoryInGb: 0.8
      ports:
      - protocol: tcp
        port: 5002
      environmentVariables:
      - name: ASPNETCORE_ENVIRONMENT
        value: Production
      - name: ASPNETCORE_URLS
        value: http://+:5002
  
  # Expense Service
  - name: expense-service
    properties:
      image: yathregistry.azurecr.io/yath-expense-service:latest
      resources:
        requests:
          cpu: 0.4
          memoryInGb: 0.8
      ports:
      - protocol: tcp
        port: 5003
      environmentVariables:
      - name: ASPNETCORE_ENVIRONMENT
        value: Production
      - name: ASPNETCORE_URLS
        value: http://+:5003
  
  # Media Service
  - name: media-service
    properties:
      image: yathregistry.azurecr.io/yath-media-service:latest
      resources:
        requests:
          cpu: 0.4
          memoryInGb: 0.8
      ports:
      - protocol: tcp
        port: 5004
      environmentVariables:
      - name: ASPNETCORE_ENVIRONMENT
        value: Production
      - name: ASPNETCORE_URLS
        value: http://+:5004
  
  # Chat Service
  - name: chat-service
    properties:
      image: yathregistry.azurecr.io/yath-chat-service:latest
      resources:
        requests:
          cpu: 0.4
          memoryInGb: 0.8
      ports:
      - protocol: tcp
        port: 5005
      environmentVariables:
      - name: ASPNETCORE_ENVIRONMENT
        value: Production
      - name: ASPNETCORE_URLS
        value: http://+:5005
  
  # Location Service
  - name: location-service
    properties:
      image: yathregistry.azurecr.io/yath-location-service:latest
      resources:
        requests:
          cpu: 0.4
          memoryInGb: 0.8
      ports:
      - protocol: tcp
        port: 5006
      environmentVariables:
      - name: ASPNETCORE_ENVIRONMENT
        value: Production
      - name: ASPNETCORE_URLS
        value: http://+:5006
  
  # Notification Service
  - name: notification-service
    properties:
      image: yathregistry.azurecr.io/yath-notification-service:latest
      resources:
        requests:
          cpu: 0.4
          memoryInGb: 0.8
      ports:
      - protocol: tcp
        port: 5007
      environmentVariables:
      - name: ASPNETCORE_ENVIRONMENT
        value: Production
      - name: ASPNETCORE_URLS
        value: http://+:5007
  
  imageRegistryCredentials:
  - server: yathregistry.azurecr.io
    username: yathregistry
    password: hP8JG4uQwujn7CVeFVzKPb5ifEXNUeT801Cxm6uudn+ACRATZEW9
  
  ipAddress:
    type: Public
    dnsNameLabel: yath-services
    ports:
    - protocol: tcp
      port: 5000
    - protocol: tcp
      port: 5001
    - protocol: tcp
      port: 5002
    - protocol: tcp
      port: 5003
    - protocol: tcp
      port: 5004
    - protocol: tcp
      port: 5005
    - protocol: tcp
      port: 5006
    - protocol: tcp
      port: 5007
    - protocol: tcp
      port: 15672
    - protocol: tcp
      port: 80
  
  osType: Linux
  restartPolicy: Always

tags:
  environment: production
  project: yath
type: Microsoft.ContainerInstance/containerGroups
